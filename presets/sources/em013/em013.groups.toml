# ============================================================================
# User-Editable Semantic Overlay: em013 (Fatalis / 黑龙, MonsterID = 101)
# Standard TOML 1.0 — paired with read-only `em013.thkmeta.toml`.
# Regenerating `.thkmeta.toml` never touches this file.
# ============================================================================

[conditions]
# Friendly aliases for monster-private opcodes (`em_*`) and THK registers (`var_*`).
posture           = "em_101"  # 0 = bipedal, 1 = quadruped ([uEm013+0x20928])
stage             = "em_103"  # 0 = P1, 1 = P2, !=0&!=1 = P3 ([uEm013+0x20964])
target_pl_flag    = "em_104"  # player flag bit 0x20000 ([cPlPlayer+0x8964])
blue_flame        = "em_106"  # 1 = skull-break failed / blue flame ([uEm013+0x20960])
story_npc         = "em_108"  # Quest 51612 Aiden/story NPC state
quest_51612_phase = "em_109"  # Quest 51612 story event helper check
binder_or_part    = "em_10a"  # Monster state bit check ([uEm013+0x1c320])
action_state_10b  = "em_10b"  # Action IDs 0xb3/0xe7/0xe8/0xe9/5 check
em_cond_10c       = "em_10c"  # uEm013 private check FUN_1404ad930
occluded          = "em_10d"  # LoS / occluded gate FUN_1404a62f0
em_cond_113       = "em_113"  # Multi-target/HP scaled check FUN_141347e90
bi_switch_timer   = "var_0"   # Bipedal state timer (op_80/op_94)
quad_switch_timer = "var_1"   # Quadruped state timer (op_81/op_95)
extra_charge_cd   = "var_5"   # Extra-charge cooldown (op_85/op_99)
quad_no_bite_flag = "var_10"  # n128/n11 flag register (op_8a/op_9e)
quad_charged      = "var_11"  # Quadruped post-rush flag (op_8b/op_9f)

[groups.phase]
p1 = "em_103=0"
p2 = "em_103=1"
p3 = "em_103!=0 & em_103!=1"

[groups.flame]
normal = "!em_106=1"
blue   = "em_106=1"

[groups.stance]
bi   = "em_101=0"
quad = "em_101=1 | (flying=false & em_101!=0)"
fly  = "flying"

# Compound phase + stance shorthands
[groups.p1]
bi   = "phase=p1 & stance=bi"
quad = "phase=p1 & stance=quad"

[groups.p2]
bi   = "phase=p2 & stance=bi"
quad = "phase=p2 & stance=quad"

[groups.p3]
bi   = "phase=p3 & stance=bi"
quad = "phase=p3 & stance=quad"

[groups.context]
main         = "parent=11 & !node=18,19,21"
knock        = "via=127 & target_state=5"
low_hp       = "via=127 & !target_state=5"
occluded     = "via=45 & em_10d"
stance_check = "via=13"
extra_charge = "node=18"

[groups.quest]
special_assignment = "quest_id=51612"
other              = "quest_id!=51612"

[groups.charged]
no  = "var_11 < 1"
yes = "var_11 >= 1"

# Named distance ranges (statically matched against THK intervals)
[groups.range]
bi_close     = "dist <= 900"
bi_close_knk = "dist <= 1000"
bi_mid       = "dist in 900..2000"
bi_long      = "dist in 2000..4500"
bi_ultra     = "dist >= 4500"
quad_close   = "dist <= 500"
quad_mid     = "dist in 500..1500"
quad_long    = "dist in 1500..5000"
quad_ultra   = "dist >= 5000"

# Named angle sectors (circular 360-deg subset inclusion)
[groups.dir]
front      = "angle in -45..45"
back       = "angle in 135..225"
side       = "angle in 45..135 | 225..315"
front_hemi = "angle in -90..90"
back_hemi  = "angle in 90..270"

